apis:
- aid: loyaltylion:loyaltylion-customers-api
  name: LoyaltyLion Customers API
  tags:
  - Customers
  - Loyalty
  - Profiles
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.loyaltylion.com/api-reference/v2/resources/customers/list-customers
  baseURL: https://api.loyaltylion.com/v2
  properties:
  - url: https://developers.loyaltylion.com/api-reference/introduction
    type: Documentation
  - url: https://developers.loyaltylion.com/api-reference/v2/resources/customers/list-customers
    type: APIReference
  - url: openapi/loyaltylion-openapi.yml
    type: OpenAPI
  description: List and update loyalty customers, read their points balances, tiers,
    and referral details, and pull the point transactions for an individual customer.
    Customers are matched by your platform merchant_id and filterable by email and
    created/updated date ranges with cursor pagination.
- aid: loyaltylion:loyaltylion-activities-api
  name: LoyaltyLion Activities API
  tags:
  - Activities
  - Rules
  - Engagement
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.loyaltylion.com/api-reference/v2/resources/activities/create-activity
  baseURL: https://api.loyaltylion.com/v2
  properties:
  - url: https://developers.loyaltylion.com/api-reference/v2/resources/activities/create-activity
    type: APIReference
  - url: openapi/loyaltylion-openapi.yml
    type: OpenAPI
  description: Record customer activities against built-in or custom loyalty rules -
    signups, clickthroughs, social actions, reviews, and more - to award points.
    Create, list, and update activities, attaching customer identity, properties,
    and referral tracking (IP address and user agent).
