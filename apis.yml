aid: loyaltylion
url: https://raw.githubusercontent.com/api-evangelist/loyaltylion/refs/heads/main/apis.yml
name: LoyaltyLion
kind: company
description: LoyaltyLion is an e-commerce loyalty and rewards platform for Shopify,
  BigCommerce, and custom storefronts, letting merchants run points, referrals, VIP
  tiers, and reward programs. Its v2 REST API (base https://api.loyaltylion.com/v2)
  is split into an Admin API for moving data in and out of LoyaltyLion - retrieving
  customers and transactions, tracking orders, and adjusting points - and a Headless
  API for building custom shopper-facing loyalty experiences in web, mobile, and POS
  apps. Requests authenticate with a Program API key passed as a Bearer token (with
  scoped access), or the deprecated token/secret pair over HTTP Basic auth. All
  endpoints share a 20 requests-per-second rate limit.
